name: Build Metro 432 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project files
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Unpack source and apply 432 Hz tuning modes
        shell: bash
        run: |
          unzip -q overlay/Metro-dev.zip -d source
          python3 overlay/patches/apply_tuning.py source/Metro-dev
          echo "sdk.dir=$ANDROID_HOME" > source/Metro-dev/local.properties
          chmod +x source/Metro-dev/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Build debug APK
        working-directory: source/Metro-dev
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metro-432-debug-apk
          path: source/Metro-dev/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
