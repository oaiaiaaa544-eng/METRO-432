name: Build standalone Metro 432 APK

on:
  push:
    branches: [main, metro-standalone-clean]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone debug-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out project files
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Unpack source and apply restored tuning and standalone identity
        shell: bash
        run: |
          unzip -q overlay/Metro-dev.zip -d source
          python3 overlay/patches/apply_tuning.py source/Metro-dev
          python3 overlay/patches/apply_solfeggio.py source/Metro-dev
          python3 overlay/patches/apply_standalone.py source/Metro-dev
          chmod +x source/Metro-dev/gradlew
          if grep -RniE 'archive\.org|Internet Archive|internetarchive' source/Metro-dev; then
            echo "Unexpected Internet Archive integration found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Build Metro 432 APK
        working-directory: source/Metro-dev
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and signing certificate
        shell: bash
        run: |
          APK="$(find source/Metro-dev/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging "$APK" | grep -F "package: name='io.github.muntashirakon.metro432'"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$APK"
          test -f "$HOME/.android/debug.keystore"
          cp "$HOME/.android/debug.keystore" metro432-signing-key.jks
          sha256sum "$APK" metro432-signing-key.jks > metro432-checksums.txt
          printf '%s\n' 'Application ID: io.github.muntashirakon.metro432' 'Launcher name: Metro 432' 'Signing key: metro432-signing-key.jks (keep private for future updates)' > metro432-install-notes.txt

      - name: Upload install package and retained signing key
        uses: actions/upload-artifact@v4
        with:
          name: Metro-432-standalone-install
          path: |
            source/Metro-dev/app/build/outputs/apk/debug/*.apk
            metro432-signing-key.jks
            metro432-checksums.txt
            metro432-install-notes.txt
          if-no-files-found: error
          retention-days: 30
