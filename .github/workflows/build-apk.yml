name: Build Metro 432 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Metro 6.1.0 source
        uses: actions/checkout@v4
        with:
          repository: MuntashirAkon/Metro
          ref: v6.1.0
          path: source

      - name: Checkout tuning changes
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Apply 432 Hz tuning changes
        shell: bash
        run: |
          base64 --decode overlay/patches/metro-432.patch.gz.b64 | gunzip > /tmp/metro-432.patch
          git -C source apply --check /tmp/metro-432.patch
          git -C source apply /tmp/metro-432.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Build debug APK
        working-directory: source
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metro-432-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
